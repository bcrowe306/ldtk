name: CI Multi-Platform Builds

on:
  push:
    branches:
      - master
      - 'dev**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: false

jobs:
  build-macos:
    name: Build macOS (arm64 & amd64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Disable Spotlight Indexing
        run: sudo mdutil -a -i off || true

      - name: Install dependencies
        run: cd app && npm install

      - name: Build macOS arm64
        run: cd app && npm run pack-macos-arm64

      - name: Build macOS x64
        run: cd app && npm run pack-macos-amd64

      - name: Test Installing and Opening macOS Applications
        run: |
          set -e
          RUNNER_ARCH=$(uname -m)
          echo "Runner architecture: $RUNNER_ARCH"

          for dmg in app/redist/*.dmg; do
            echo "=========================================="
            echo "Testing DMG: $dmg"
            echo "=========================================="
            
            MOUNT_DIR=$(mktemp -d)
            echo "Attaching $dmg to $MOUNT_DIR..."
            hdiutil attach "$dmg" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
            
            APP_PATH=$(find "$MOUNT_DIR" -maxdepth 2 -name "*.app" -print -quit)
            if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
              echo "Error: No .app bundle found in $dmg"
              hdiutil detach "$MOUNT_DIR" -force || true
              exit 1
            fi
            echo "Found bundle: $APP_PATH"
            
            echo "--> Verifying code signature & sealed resources in DMG..."
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            
            TEST_INSTALL_DIR=$(mktemp -d)
            echo "--> Testing installation (copying to $TEST_INSTALL_DIR)..."
            cp -R "$APP_PATH" "$TEST_INSTALL_DIR/"
            
            echo "Detaching DMG..."
            hdiutil detach "$MOUNT_DIR" -force || (sleep 2 && hdiutil detach "$MOUNT_DIR" -force) || true
            
            INSTALLED_APP="$TEST_INSTALL_DIR/$(basename "$APP_PATH")"
            echo "--> Verifying installed application signature..."
            codesign --verify --deep --strict --verbose=2 "$INSTALLED_APP"
            
            # Determine DMG architecture
            DMG_ARCH="unknown"
            if [[ "$dmg" == *"arm64"* ]]; then
              DMG_ARCH="arm64"
            elif [[ "$dmg" == *"x64"* ]] || [[ "$dmg" == *"amd64"* ]]; then
              DMG_ARCH="x86_64"
            fi
            echo "DMG Arch: $DMG_ARCH, Runner Arch: $RUNNER_ARCH"
            
            # If native architecture or Rosetta is available, test opening the application
            CAN_RUN=false
            if [ "$RUNNER_ARCH" = "$DMG_ARCH" ] || [ "$DMG_ARCH" = "unknown" ]; then
              CAN_RUN=true
            elif [ "$RUNNER_ARCH" = "arm64" ] && [ "$DMG_ARCH" = "x86_64" ]; then
              if /usr/bin/pgrep oahd >/dev/null 2>&1 || [ -f "/Library/Apple/usr/libexec/oah/libRosettaRuntime" ]; then
                CAN_RUN=true
              fi
            fi

            if [ "$CAN_RUN" = true ]; then
              echo "--> Testing opening installed application via LaunchServices..."
              open -n "$INSTALLED_APP"
              sleep 4
              
              # Verify application process is alive and didn't crash on start
              APP_PID=$(pgrep -f "$INSTALLED_APP" || pgrep -f "LDtk" || true)
              if [ -n "$APP_PID" ]; then
                echo "SUCCESS: LDtk is running cleanly with PID(s): $APP_PID"
                killall -9 LDtk 2>/dev/null || true
              else
                echo "ERROR: LDtk failed to launch or crashed on startup!"
                exit 1
              fi
            else
              echo "Skipping execution test for $DMG_ARCH on $RUNNER_ARCH runner."
            fi
            
            rm -rf "$TEST_INSTALL_DIR"
            echo "Verification passed for $dmg!"
          done

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_installers
          path: app/redist/*.dmg

  build-windows:
    name: Build Windows (win_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd app && npm install

      - name: Build Windows x64
        run: cd app && npm run pack-win64

      - name: Upload Windows win_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: win_64
          path: app/redist/*.exe

  build-linux:
    name: Build Linux (AppImage & deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd app && npm install

      - name: Build Linux (AppImage & deb)
        run: cd app && npm run pack-linux

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux_appimage
          path: app/redist/*.AppImage

      - name: Upload Linux deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux_deb
          path: app/redist/*.deb

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release files
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
