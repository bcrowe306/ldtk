name: CI Multi-Platform Builds

on:
  push:
    branches:
      - master
      - 'dev**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: false

jobs:
  build-macos:
    name: Build macOS (arm64 & amd64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd app && npm install

      - name: Build macOS (arm64 & x64)
        run: cd app && npm run pack-macos

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_installers
          path: app/redist/*.dmg

  build-windows:
    name: Build Windows (win_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd app && npm install

      - name: Build Windows x64
        run: cd app && npm run pack-win64

      - name: Upload Windows win_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: win_64
          path: app/redist/*.exe

  build-linux:
    name: Build Linux (AppImage & deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd app && npm install

      - name: Build Linux (AppImage & deb)
        run: cd app && npm run pack-linux

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux_appimage
          path: app/redist/*.AppImage

      - name: Upload Linux deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux_deb
          path: app/redist/*.deb

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release files
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
